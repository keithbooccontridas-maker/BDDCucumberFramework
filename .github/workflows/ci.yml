name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Install ChromeDriver
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-browser

    - name: Create config.properties for CI
      run: |
        mkdir -p src/test/resources
        echo "base.url=https://parabank.parasoft.com/parabank/index.htm" > src/test/resources/config.properties
        echo "valid.username=keith123" >> src/test/resources/config.properties
        echo "valid.password=secretpassword" >> src/test/resources/config.properties
        echo "headless=true" >> src/test/resources/config.properties

    - name: Run tests with Maven
      run: mvn test

    - name: Upload ExtentReport
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: extent-report
        path: target/ExtentReport/
        retention-days: 30

    - name: Upload screenshots
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: failure-screenshots
        path: target/screenshots/
        retention-days: 30
